name: Linux compatibility
on:
  pull_request:
    paths: ['scripts/**', 'assets/**', 'project.godot', 'export_presets.cfg', 'tests/**', 'tools/linux/**', '.github/workflows/linux.yml']
  workflow_dispatch:
concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    name: Linux ${{ matrix.suite }}
    strategy:
      fail-fast: false
      matrix:
        suite: [gameplay, multiplayer, graphics]
    runs-on: ubuntu-24.04
    # Dependency mirrors can take several minutes; keep enough room for the
    # complete graphical/network suite and the native release smoke test.
    timeout-minutes: 45
    env:
      GODOT_VERSION: 4.7.2
      LIBGL_ALWAYS_SOFTWARE: '1'
      XDG_DATA_HOME: ${{ github.workspace }}/test-results/linux-data
      XDG_CONFIG_HOME: ${{ github.workspace }}/test-results/linux-config
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux display and audio libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb xauth openbox weston wmctrl imagemagick libgl1-mesa-dri libegl1 libpulse0 libasound2t64 libdecor-0-0
      - name: Fetch matching official Godot engine and templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results/linux exports/linux "$RUNNER_TEMP/godot"
          cd "$RUNNER_TEMP/godot"
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl -fL --retry 3 "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o engine.zip
          curl -fL --retry 3 "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o templates.zip
          unzip -q engine.zip
          unzip -q templates.zip 'templates/linux_*x86_64' 'templates/version.txt'
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          ln -s "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
          target="$XDG_DATA_HOME/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$target"
          cp templates/* "$target/"
      - name: Import and audit case-sensitive resources
        run: |
          python3 tools/linux/audit_resources.py
          timeout 300 godot --headless --editor --path . --import --quit > test-results/linux/import.log 2>&1
          ! grep -E 'SCRIPT ERROR|ERROR:' test-results/linux/import.log
      - name: Recorded audio and real mixer output
        if: matrix.suite == 'gameplay'
        run: |
          python3 tests/test_audio_assets.py
          for entry in 'test_audio AUDIO_QA_OK' 'test_audio_mix AUDIO_MIX_OK' 'test_animal_audio ANIMAL_AUDIO_OK'; do
            read -r test marker <<< "$entry"
            if ! timeout 180 godot --headless --audio-driver Dummy --path . --script "tests/$test.gd" > "test-results/linux/$test.log" 2>&1; then cat "test-results/linux/$test.log"; exit 1; fi
            cat "test-results/linux/$test.log"
            grep -q "$marker" "test-results/linux/$test.log"
            if grep -E 'SCRIPT ERROR|ERROR:' "test-results/linux/$test.log"; then exit 1; fi
          done
      - name: Cave rigs and helper panels
        if: matrix.suite == 'graphics'
        run: |
          set -euo pipefail
          for entry in 'test_cave_animation CAVE_ANIMATION_OK' 'test_cave_world CAVE_WORLD_OK'; do
            set -- $entry
            xvfb-run -a timeout 180 godot --audio-driver Dummy --path . --script tests/$1.gd > test-results/linux/$1.log 2>&1
            grep "$2" test-results/linux/$1.log
            ! grep -E 'SCRIPT ERROR|ERROR:' test-results/linux/$1.log
          done
      - name: Pickup prototype gameplay
        if: matrix.suite == 'gameplay'
        run: |
          timeout 180 godot --headless --audio-driver Dummy --path . --script tests/test_pickup.gd > test-results/linux/pickup.log 2>&1
          cat test-results/linux/pickup.log
          grep -q PICKUP_OK test-results/linux/pickup.log
          ! grep -E 'SCRIPT ERROR|ERROR:' test-results/linux/pickup.log
          timeout 240 godot --headless --audio-driver Dummy --path . --script tests/test_pickup_cargo.gd > test-results/linux/pickup-cargo.log 2>&1
          cat test-results/linux/pickup-cargo.log
          grep -q PICKUP_CARGO_OK test-results/linux/pickup-cargo.log
          ! grep -E 'SCRIPT ERROR|ERROR:' test-results/linux/pickup-cargo.log
          timeout 240 godot --headless --audio-driver Dummy --path . --script tests/test_garage.gd > test-results/linux/garage.log 2>&1
          cat test-results/linux/garage.log
          grep -q GARAGE_OK test-results/linux/garage.log
          ! grep -E 'SCRIPT ERROR|ERROR:' test-results/linux/garage.log
      - name: Linux gameplay and saves
        if: matrix.suite == 'gameplay'
        shell: bash
        run: |
          set -euo pipefail
          for entry in 'test_cave_world CAVE_WORLD_OK' 'test_cave_crew CAVE_CREW_OK' 'test_cave_animation CAVE_ANIMATION_OK' 'test_cave_details CAVE_DETAILS_OK' 'test_build_edit BUILD_EDIT_OK' 'test_pickup_physics PICKUP_PHYSICS_OK' 'test_young YOUNG_OK' 'test_young_life YOUNG_LIFE_OK' 'test_locomotion LOCOMOTION_OK' 'test_locomotion_integration LOCOMOTION_INTEGRATION_OK' 'test_animal_care ANIMAL_CARE_OK' 'test_animal_life ANIMAL_LIFE_OK' 'test_orchard_staff ORCHARD_STAFF_OK' 'test_orchard_staff_hud ORCHARD_STAFF_HUD_OK' 'test_orchard_staff_motion ORCHARD_STAFF_MOTION_OK' 'test_orchard_staff_integration ORCHARD_STAFF_INTEGRATION_OK' 'test_rosa ROSA_OK' 'test_rosa_world ROSA_WORLD_OK' 'test_residents RESIDENTS_OK' 'test_residents_world RESIDENTS_WORLD_OK' 'test_orchard ORCHARD_OK' 'test_orchard_view ORCHARD_VIEW_OK' 'test_orchard_trade ORCHARD_TRADE_OK' 'test_orchard_integration ORCHARD_INTEGRATION_OK' 'test_horse_art_gate HORSE_ART_GATE_CLEARANCE_OK' 'test_farm_art_integration FARM_ART_INTEGRATION_OK' 'test_farm_art_ui FARM_ART_UI_OK' 'test_chapter CHAPTER_OK' 'test_chapter_world CHAPTER_WORLD_OK' 'test_sandbox_resources SANDBOX_RESOURCES_OK' 'test_bridge_clearance BRIDGE_CLEARANCE_OK' 'test_bridge_sandbox_ui BRIDGE_SANDBOX_UI_OK' 'test_shore_life SHORE_LIFE_OK' 'test_farm_slots FARM_SLOTS_OK' 'test_shoulder_camera SHOULDER_CAMERA_OK' 'test_pistol_pose PISTOL_POSE_OK' 'test_shoulder_aim SHOULDER_AIM_OK' 'test_temporary_fall TEMPORARY_FALL_OK' 'test_fall_targets FALL_TARGETS_OK' 'test_fall_pose FALL_POSE_OK' 'test_combat_authority COMBAT_AUTHORITY_OK' 'test_armory_integration ARMORY_INTEGRATION_OK' 'test_horse_route_lifecycle ROUTE_CANCEL_OK' 'test_horse_summon LONG_WHISTLE_OK' 'test_farm_stream FARM_STREAM_OK' 'test_waterfall_region WATERFALL_REGION_OK' 'test_swimming SWIMMING_OK' 'test_waterfall WATERFALL_OK' 'test_horse_grounding HORSE_GROUNDING_OK' 'test_mining_pose MINING_POSE_OK' 'test_mine_exploration MINE_EXPLORATION_OK' 'test_resources RESOURCES_OK' 'test_gathering GATHERING_OK' 'test_resource_world RESOURCE_WORLD_OK' 'test_region REGION_OK' 'test_horse HORSE_STATE_OK' 'test_settings SETTINGS_STATE_OK' 'test_fullscreen FULLSCREEN_QA_OK' 'test_linux LINUX_QA_OK' 'test_coop_save COOP_SAVE_OK' 'test_coop_commands COOP_COMMANDS_OK' 'test_coop_automation COOP_AUTOMATION_OK' 'test_character_choice CHARACTER_CHOICE_OK' 'test_livestock_pose LIVESTOCK_POSE_OK' 'test_day_night DAY_NIGHT_OK' 'test_build_menu BUILD_MENU_OK' 'test_pigsty_assets PIGSTY_ASSETS_OK' 'test_pigs PIGS_GAME_OK' 'test_map_places MAP_PLACES_OK' 'test_cat CAT_OK' 'test_companions COMPANIONS_OK'; do
            read -r test marker <<< "$entry"
            if ! timeout 180 godot --headless --audio-driver Dummy --path . --script "tests/$test.gd" > "test-results/linux/$test.log" 2>&1; then cat "test-results/linux/$test.log"; exit 1; fi
            cat "test-results/linux/$test.log"
            grep -q "$marker" "test-results/linux/$test.log"
            if grep -E 'SCRIPT ERROR|ERROR:' "test-results/linux/$test.log"; then exit 1; fi
          done
      - name: Linux multiplayer with two isolated processes
        if: matrix.suite == 'multiplayer'
        run: |
          python3 tests/run_network.py --godot godot
          python3 tests/run_network.py --godot godot --test test_coop
          python3 tests/run_network.py --godot godot --test test_coop_full
          python3 tests/run_network.py --godot godot --test test_coop_night
          python3 tests/run_network.py --godot godot --test test_coop_pigs
          python3 tests/run_network.py --godot godot --test test_coop_cat
          python3 tests/run_network.py --godot godot --test test_coop_companions
          python3 tests/run_network.py --godot godot --test test_coop_horse_call
          python3 tests/run_network.py --godot godot --test test_coop_map
          python3 tests/run_network.py --godot godot --test test_coop_region
          python3 tests/run_network.py --godot godot --test test_coop_sandbox
          python3 tests/run_network.py --godot godot --test test_coop_gathering
          python3 tests/run_network.py --godot godot --test test_coop_swimming
          python3 tests/run_network.py --godot godot --test test_coop_combat
          python3 tests/run_network.py --godot godot --test test_coop_fall
          python3 tests/run_network.py --godot godot --test test_coop_aim
          python3 tests/run_network.py --godot godot --test test_coop_garage
          python3 tests/run_network.py --godot godot --test test_coop_residents
          python3 tests/run_network.py --godot godot --test test_coop_chapter
          python3 tests/run_network.py --godot godot --test test_coop_orchard
          python3 tests/run_network.py --godot godot --test test_coop_orchard_staff
          python3 tests/run_network.py --godot godot --test test_coop_cave
          python3 tests/run_network.py --godot godot --test test_coop_animal_care
          python3 tests/run_network.py --godot godot --test test_coop_young
          python3 tests/run_network.py --godot godot --test test_coop_locomotion
          python3 tests/run_network.py --godot godot --test test_coop_build_edit
      - name: X11 graphical gameplay and fullscreen
        if: matrix.suite == 'graphics'
        run: |
          xvfb-run -a -s '-screen 0 1920x1080x24' bash -c 'openbox >test-results/linux/openbox.log 2>&1 & timeout 180 godot --display-driver x11 --audio-driver Dummy --path . --script tests/test_linux.gd >test-results/linux/x11.log 2>&1'
          cat test-results/linux/x11.log
          grep -q LINUX_QA_OK test-results/linux/x11.log
          ! grep -E 'SCRIPT ERROR|ERROR:' test-results/linux/x11.log
      - name: Construction editing and pickup physics graphical review
        if: matrix.suite == 'graphics'
        run: |
          xvfb-run -a timeout 180 godot --audio-driver Dummy --path . --script tests/test_build_edit.gd > test-results/linux/build-edit.log 2>&1
          grep -q BUILD_EDIT_OK test-results/linux/build-edit.log
          ! grep -E 'SCRIPT ERROR|ERROR:' test-results/linux/build-edit.log
          xvfb-run -a timeout 180 godot --audio-driver Dummy --path . --script tests/test_pickup_physics.gd > test-results/linux/pickup-physics.log 2>&1
          grep -q PICKUP_PHYSICS_OK test-results/linux/pickup-physics.log
          ! grep -E 'SCRIPT ERROR|ERROR:' test-results/linux/pickup-physics.log
          cp test-results/build-edit-*.png test-results/pickup-airborne.png test-results/linux/
      - name: Player locomotion graphical review
        if: matrix.suite == 'graphics'
        run: |
          xvfb-run -a timeout 240 godot --audio-driver Dummy --path . --script tests/test_locomotion_integration.gd > test-results/linux/locomotion-visual.log 2>&1
          grep -q LOCOMOTION_INTEGRATION_OK test-results/linux/locomotion-visual.log
          ! grep -E 'SCRIPT ERROR|ERROR:' test-results/linux/locomotion-visual.log
          cp -r test-results/locomotion test-results/linux/
      - name: Orchard and first harvest graphical review
        if: matrix.suite == 'graphics'
        run: |
          for entry in 'test_orchard_staff_hud ORCHARD_STAFF_HUD_OK' 'test_orchard_staff_motion ORCHARD_STAFF_MOTION_OK' 'test_orchard_staff_integration ORCHARD_STAFF_INTEGRATION_OK' 'test_orchard_trade ORCHARD_TRADE_OK' 'test_orchard_integration ORCHARD_INTEGRATION_OK'; do
            read -r test marker <<< "$entry"
            if ! xvfb-run -a timeout 180 godot --audio-driver Dummy --path . --script "tests/$test.gd" > "test-results/linux/$test-visual.log" 2>&1; then cat "test-results/linux/$test-visual.log"; exit 1; fi
            grep -q "$marker" "test-results/linux/$test-visual.log"
            if grep -E 'SCRIPT ERROR|ERROR:' "test-results/linux/$test-visual.log"; then exit 1; fi
          done
          cp test-results/orchard-*.png test-results/zeca-orchard-*.png test-results/linux/
      - name: Young animals graphical review
        if: matrix.suite == 'graphics'
        run: |
          xvfb-run -a timeout 240 godot --audio-driver Dummy --path . --script tests/test_young_life.gd > test-results/linux/young-visual.log 2>&1
          grep -q YOUNG_LIFE_OK test-results/linux/young-visual.log
          ! grep -E 'SCRIPT ERROR|ERROR:' test-results/linux/young-visual.log
          cp test-results/young-*.png test-results/linux/
      - name: Animal care and routines graphical review
        if: matrix.suite == 'graphics'
        run: |
          xvfb-run -a timeout 240 godot --audio-driver Dummy --path . --script tests/test_animal_life.gd > test-results/linux/animals-visual.log 2>&1
          grep -q ANIMAL_LIFE_OK test-results/linux/animals-visual.log
          ! grep -E 'SCRIPT ERROR|ERROR:' test-results/linux/animals-visual.log
          cp test-results/animals-*.png test-results/linux/
      - name: Farm art and construction graphical review
        if: matrix.suite == 'graphics'
        run: |
          xvfb-run -a timeout 180 godot --audio-driver Dummy --path . --script tests/test_farm_art_integration.gd > test-results/linux/farm-art.log 2>&1
          grep -q FARM_ART_INTEGRATION_OK test-results/linux/farm-art.log
          ! grep -E 'SCRIPT ERROR|ERROR:' test-results/linux/farm-art.log
          xvfb-run -a timeout 180 godot --audio-driver Dummy --path . --script tests/test_farm_art_ui.gd > test-results/linux/farm-art-ui.log 2>&1
          grep -q FARM_ART_UI_OK test-results/linux/farm-art-ui.log
          ! grep -E 'SCRIPT ERROR|ERROR:' test-results/linux/farm-art-ui.log
          cp test-results/farm_art_integration.png test-results/farm-art-ui-*.png test-results/linux/
      - name: Rosa story and routine graphical review
        if: matrix.suite == 'graphics'
        run: |
          xvfb-run -a timeout 180 godot --audio-driver Dummy --path . --script tests/test_rosa_world.gd > test-results/linux/rosa-visual.log 2>&1
          grep -q ROSA_WORLD_OK test-results/linux/rosa-visual.log
          if grep -E 'SCRIPT ERROR|ERROR:' test-results/linux/rosa-visual.log; then exit 1; fi
          cp test-results/rosa-*.png test-results/linux/
      - name: Residents and deliveries graphical review
        if: matrix.suite == 'graphics'
        run: |
          xvfb-run -a timeout 240 godot --audio-driver Dummy --path . --script tests/test_residents_world.gd > test-results/linux/residents-visual.log 2>&1
          grep -q RESIDENTS_WORLD_OK test-results/linux/residents-visual.log
          ! grep -E 'SCRIPT ERROR|ERROR:' test-results/linux/residents-visual.log
          cp test-results/residents-*.png test-results/linux/
      - name: First chapter graphical review
        if: matrix.suite == 'graphics'
        run: |
          xvfb-run -a timeout 180 godot --audio-driver Dummy --path . --script tests/test_chapter_world.gd > test-results/linux/chapter-world.log 2>&1
          grep -q CHAPTER_WORLD_OK test-results/linux/chapter-world.log
          ! grep -E 'SCRIPT ERROR|ERROR:' test-results/linux/chapter-world.log
          cp test-results/chapter-*.png test-results/linux/
      - name: Garage and customized pickup graphical review
        if: matrix.suite == 'graphics'
        run: |
          xvfb-run -a timeout 240 godot --audio-driver Dummy --path . --script tests/test_garage.gd > test-results/linux/garage-visual.log 2>&1
          grep -q GARAGE_OK test-results/linux/garage-visual.log
          ! grep -E 'SCRIPT ERROR|ERROR:' test-results/linux/garage-visual.log
          cp test-results/garage-*.png test-results/linux/
      - name: Pickup prototype graphical review
        if: matrix.suite == 'graphics'
        run: |
          xvfb-run -a timeout 180 godot --audio-driver Dummy --path . --script tests/test_pickup.gd > test-results/linux/pickup-visual.log 2>&1
          grep -q PICKUP_OK test-results/linux/pickup-visual.log
          ! grep -E 'SCRIPT ERROR|ERROR:' test-results/linux/pickup-visual.log
          xvfb-run -a timeout 240 godot --audio-driver Dummy --path . --script tests/test_pickup_cargo.gd > test-results/linux/pickup-cargo-visual.log 2>&1
          grep -q PICKUP_CARGO_OK test-results/linux/pickup-cargo-visual.log
          ! grep -E 'SCRIPT ERROR|ERROR:' test-results/linux/pickup-cargo-visual.log
          cp test-results/pickup-*.png test-results/linux/
      - name: Living shore graphical review
        if: matrix.suite == 'graphics'
        run: |
          xvfb-run -a timeout 180 godot --audio-driver Dummy --path . --script tests/test_shore_life.gd > test-results/linux/shore.log 2>&1
          grep -q SHORE_LIFE_OK test-results/linux/shore.log
          if grep -E 'SCRIPT ERROR|ERROR:' test-results/linux/shore.log; then exit 1; fi
          cp test-results/shore-*.png test-results/linux/
      - name: Shoulder aim graphical review
        if: matrix.suite == 'graphics'
        run: |
          xvfb-run -a timeout 180 godot --audio-driver Dummy --path . --script tests/render_shoulder_world.gd > test-results/linux/shoulder-world.log 2>&1
          grep -q SHOULDER_WORLD_OK test-results/linux/shoulder-world.log
          if grep -E 'SCRIPT ERROR|ERROR:' test-results/linux/shoulder-world.log; then exit 1; fi
          cp -r test-results/shoulder-world test-results/linux/
      - name: Temporary fall graphical review
        if: matrix.suite == 'graphics'
        run: |
          xvfb-run -a timeout 180 godot --audio-driver Dummy --path . --script tests/render_fall_world.gd > test-results/linux/fall-world.log 2>&1
          grep -q FALL_WORLD_VISUAL_OK test-results/linux/fall-world.log
          if grep -E 'SCRIPT ERROR|ERROR:' test-results/linux/fall-world.log; then exit 1; fi
          cp -r test-results/fall-world test-results/linux/
      - name: Day and night graphical review
        if: matrix.suite == 'graphics'
        run: |
          xvfb-run -a timeout 180 godot --audio-driver Dummy --path . --script tests/test_day_night.gd > test-results/linux/day-night.log 2>&1
          grep -q DAY_NIGHT_OK test-results/linux/day-night.log
          if grep -E 'SCRIPT ERROR|ERROR:' test-results/linux/day-night.log; then exit 1; fi
          cp test-results/night-*.png test-results/linux/
      - name: Authored valley graphical review
        if: matrix.suite == 'graphics'
        run: |
          xvfb-run -a timeout 180 godot --audio-driver Dummy --path . --script tests/test_region.gd > test-results/linux/region.log 2>&1
          grep -q REGION_OK test-results/linux/region.log
          if grep -E 'SCRIPT ERROR|ERROR:' test-results/linux/region.log; then exit 1; fi
          cp test-results/region-*.png test-results/linux/
      - name: Map visual review
        if: matrix.suite == 'graphics'
        run: |
          xvfb-run -a timeout 180 godot --audio-driver Dummy --path . --script tests/test_map_places.gd > test-results/linux/map.log 2>&1
          grep -q MAP_PLACES_OK test-results/linux/map.log
          if grep -E 'SCRIPT ERROR|ERROR:' test-results/linux/map.log; then exit 1; fi
          cp test-results/map-places.png test-results/linux/
      - name: Fishing and mining graphical review
        if: matrix.suite == 'graphics'
        run: |
          xvfb-run -a timeout 180 godot --audio-driver Dummy --path . --script tests/test_resource_world.gd > test-results/linux/resources-world.log 2>&1
          grep -q RESOURCE_WORLD_OK test-results/linux/resources-world.log
          if grep -E 'SCRIPT ERROR|ERROR:' test-results/linux/resources-world.log; then exit 1; fi
          cp test-results/resource-*.png test-results/linux/
      - name: Mine galleries graphical review
        if: matrix.suite == 'graphics'
        run: |
          xvfb-run -a timeout 180 godot --audio-driver Dummy --path . --script tests/test_mine_exploration.gd > test-results/linux/mine-exploration.log 2>&1
          grep -q MINE_EXPLORATION_OK test-results/linux/mine-exploration.log
          if grep -E 'SCRIPT ERROR|ERROR:' test-results/linux/mine-exploration.log; then exit 1; fi
          cp test-results/mine-*.png test-results/linux/
      - name: Construction menu and mouse building in cooperative play
        if: matrix.suite == 'graphics'
        run: |
          xvfb-run -a timeout 180 godot --audio-driver Dummy --path . --script tests/test_build_menu.gd > test-results/linux/build-menu.log 2>&1
          grep -q BUILD_MENU_OK test-results/linux/build-menu.log
          if grep -E 'SCRIPT ERROR|ERROR:' test-results/linux/build-menu.log; then exit 1; fi
          cp test-results/build-menu-*.png test-results/linux/
          xvfb-run -a python3 tests/run_network.py --godot godot --gui --test test_coop_build_menu
      - name: Wayland graphical gameplay and fullscreen
        if: matrix.suite == 'graphics'
        shell: bash
        run: |
          set -euo pipefail
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/wayland-runtime"
          mkdir -p "$XDG_RUNTIME_DIR"; chmod 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless-backend.so --use-pixman --width=1920 --height=1080 --socket=wayland-qa --idle-time=0 >test-results/linux/weston.log 2>&1 &
          for i in $(seq 1 50); do [ -S "$XDG_RUNTIME_DIR/wayland-qa" ] && break; sleep .1; done
          export WAYLAND_DISPLAY=wayland-qa
          timeout 180 godot --display-driver wayland --audio-driver Dummy --path . --script tests/test_linux.gd >test-results/linux/wayland.log 2>&1
          cat test-results/linux/wayland.log
          grep -q LINUX_QA_OK test-results/linux/wayland.log
          ! grep -E 'SCRIPT ERROR|ERROR:' test-results/linux/wayland.log
      - name: Export and run the native release
        if: matrix.suite == 'graphics'
        shell: bash
        run: |
          set -euo pipefail
          timeout 300 godot --headless --path . --export-release 'Linux Desktop' exports/linux/DoMatoAoMilhao.x86_64 >test-results/linux/export.log 2>&1
          ! grep -E 'SCRIPT ERROR|ERROR:' test-results/linux/export.log
          chmod +x exports/linux/DoMatoAoMilhao.x86_64
          file exports/linux/DoMatoAoMilhao.x86_64 | tee test-results/linux/binary.txt
          ldd exports/linux/DoMatoAoMilhao.x86_64 | tee test-results/linux/libraries.txt
          ! grep -q 'not found' test-results/linux/libraries.txt
          xvfb-run -a -s '-screen 0 1920x1080x24' timeout 180 bash tools/linux/smoke_release.sh
          cat test-results/linux/export-smoke.log
          ! grep -E 'SCRIPT ERROR|ERROR:' test-results/linux/export-smoke.log
          git rev-parse HEAD > exports/linux/COMMIT.txt
          cp tools/linux/jogar.sh exports/linux/
          cp LINUX.md exports/linux/LEIA-ME.md
          cp PROFUNDEZAS.md CONSTRUCAO.md FILHOTES.md ANIMAIS.md MOVIMENTO.md ZECA_POMAR.md ROSA.md ENTREGAS.md POMAR.md GARAGEM.md ARTE_FAZENDA.md PRIMEIROS_LACOS.md CAMIONETINHA.md GODOT_LICENSE.txt AUDIO.md AUDIO_CREDITS.md MULTIPLAYER.md AGUAS_VIVAS.md FAZENDAS.md QUEDA_RETORNO.md MIRA.md MAPA.md VALE_SERRA.md PESCA_MINERACAO.md exports/linux/
          chmod +x exports/linux/jogar.sh
          tar -czf exports/DoMatoAoMilhao-Linux-x86_64.tar.gz -C exports/linux .
          sha256sum exports/DoMatoAoMilhao-Linux-x86_64.tar.gz | tee exports/SHA256SUMS
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: linux-validation-${{ matrix.suite }}
          path: |
            test-results/linux/
            test-results/network-*/host.log
            test-results/network-*/client.log
      - uses: actions/upload-artifact@v5
        if: matrix.suite == 'graphics'
        with:
          name: DoMatoAoMilhao-Linux-x86_64
          path: |
            exports/DoMatoAoMilhao-Linux-x86_64.tar.gz
            exports/SHA256SUMS
  linux:
    if: always()
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - name: Require every Linux suite
        env:
          SUITE_RESULT: ${{ needs.validate.result }}
        run: test "$SUITE_RESULT" = success
