name: Linux compatibility
on:
  pull_request:
    paths: ['scripts/**', 'assets/**', 'project.godot', 'export_presets.cfg', 'tests/**', 'tools/linux/**', '.github/workflows/linux.yml']
  workflow_dispatch:
concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    name: Linux ${{ matrix.suite }}
    strategy:
      fail-fast: false
      matrix:
        suite: [gameplay, multiplayer, graphics]
    runs-on: ubuntu-24.04
    # Dependency mirrors can take several minutes; keep enough room for the
    # complete graphical/network suite and the native release smoke test.
    timeout-minutes: 45
    env:
      GODOT_VERSION: 4.7.2
      LIBGL_ALWAYS_SOFTWARE: '1'
      XDG_DATA_HOME: ${{ github.workspace }}/test-results/linux-data
      XDG_CONFIG_HOME: ${{ github.workspace }}/test-results/linux-config
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux display and audio libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb xauth openbox weston wmctrl imagemagick libgl1-mesa-dri libegl1 libpulse0 libasound2t64 libdecor-0-0
      - name: Fetch matching official Godot engine and templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results/linux exports/linux "$RUNNER_TEMP/godot"
          cd "$RUNNER_TEMP/godot"
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl -fL --retry 3 "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o engine.zip
          curl -fL --retry 3 "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o templates.zip
          unzip -q engine.zip
          unzip -q templates.zip 'templates/linux_*x86_64' 'templates/version.txt'
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          ln -s "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
          target="$XDG_DATA_HOME/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$target"
          cp templates/* "$target/"
      - name: Import and audit case-sensitive resources
        run: |
          python3 tools/linux/audit_resources.py
          timeout 300 godot --headless --editor --path . --import --quit > test-results/linux/import.log 2>&1
          ! grep -E 'SCRIPT ERROR|ERROR:' test-results/linux/import.log
      - name: Linux gameplay and saves
        if: matrix.suite == 'gameplay'
        shell: bash
        run: |
          set -euo pipefail
          for entry in 'test_farm_slots FARM_SLOTS_OK' 'test_shoulder_camera SHOULDER_CAMERA_OK' 'test_pistol_pose PISTOL_POSE_OK' 'test_shoulder_aim SHOULDER_AIM_OK' 'test_temporary_fall TEMPORARY_FALL_OK' 'test_fall_targets FALL_TARGETS_OK' 'test_fall_pose FALL_POSE_OK' 'test_combat_authority COMBAT_AUTHORITY_OK' 'test_armory_integration ARMORY_INTEGRATION_OK' 'test_horse_route_lifecycle ROUTE_CANCEL_OK' 'test_horse_summon LONG_WHISTLE_OK' 'test_farm_stream FARM_STREAM_OK' 'test_waterfall_region WATERFALL_REGION_OK' 'test_swimming SWIMMING_OK' 'test_waterfall WATERFALL_OK' 'test_horse_grounding HORSE_GROUNDING_OK' 'test_mining_pose MINING_POSE_OK' 'test_mine_exploration MINE_EXPLORATION_OK' 'test_resources RESOURCES_OK' 'test_gathering GATHERING_OK' 'test_resource_world RESOURCE_WORLD_OK' 'test_region REGION_OK' 'test_horse HORSE_STATE_OK' 'test_settings SETTINGS_STATE_OK' 'test_fullscreen FULLSCREEN_QA_OK' 'test_linux LINUX_QA_OK' 'test_coop_save COOP_SAVE_OK' 'test_coop_commands COOP_COMMANDS_OK' 'test_coop_automation COOP_AUTOMATION_OK' 'test_character_choice CHARACTER_CHOICE_OK' 'test_livestock_pose LIVESTOCK_POSE_OK' 'test_day_night DAY_NIGHT_OK' 'test_build_menu BUILD_MENU_OK' 'test_pigsty_assets PIGSTY_ASSETS_OK' 'test_pigs PIGS_GAME_OK' 'test_map_places MAP_PLACES_OK' 'test_cat CAT_OK' 'test_companions COMPANIONS_OK'; do
            read -r test marker <<< "$entry"
            timeout 180 godot --headless --audio-driver Dummy --path . --script "tests/$test.gd" > "test-results/linux/$test.log" 2>&1
            cat "test-results/linux/$test.log"
            grep -q "$marker" "test-results/linux/$test.log"
            if grep -E 'SCRIPT ERROR|ERROR:' "test-results/linux/$test.log"; then exit 1; fi
          done
      - name: Linux multiplayer with two isolated processes
        if: matrix.suite == 'multiplayer'
        run: |
          python3 tests/run_network.py --godot godot
          python3 tests/run_network.py --godot godot --test test_coop
          python3 tests/run_network.py --godot godot --test test_coop_full
          python3 tests/run_network.py --godot godot --test test_coop_night
          python3 tests/run_network.py --godot godot --test test_coop_pigs
          python3 tests/run_network.py --godot godot --test test_coop_cat
          python3 tests/run_network.py --godot godot --test test_coop_companions
          python3 tests/run_network.py --godot godot --test test_coop_horse_call
          python3 tests/run_network.py --godot godot --test test_coop_map
          python3 tests/run_network.py --godot godot --test test_coop_region
          python3 tests/run_network.py --godot godot --test test_coop_gathering
          python3 tests/run_network.py --godot godot --test test_coop_swimming
          python3 tests/run_network.py --godot godot --test test_coop_combat
          python3 tests/run_network.py --godot godot --test test_coop_fall
          python3 tests/run_network.py --godot godot --test test_coop_aim
      - name: X11 graphical gameplay and fullscreen
        if: matrix.suite == 'graphics'
        run: |
          xvfb-run -a -s '-screen 0 1920x1080x24' bash -c 'openbox >test-results/linux/openbox.log 2>&1 & timeout 180 godot --display-driver x11 --audio-driver Dummy --path . --script tests/test_linux.gd >test-results/linux/x11.log 2>&1'
          cat test-results/linux/x11.log
          grep -q LINUX_QA_OK test-results/linux/x11.log
          ! grep -E 'SCRIPT ERROR|ERROR:' test-results/linux/x11.log
      - name: Shoulder aim graphical review
        if: matrix.suite == 'graphics'
        run: |
          xvfb-run -a timeout 180 godot --audio-driver Dummy --path . --script tests/render_shoulder_world.gd > test-results/linux/shoulder-world.log 2>&1
          grep -q SHOULDER_WORLD_OK test-results/linux/shoulder-world.log
          if grep -E 'SCRIPT ERROR|ERROR:' test-results/linux/shoulder-world.log; then exit 1; fi
          cp -r test-results/shoulder-world test-results/linux/
      - name: Temporary fall graphical review
        if: matrix.suite == 'graphics'
        run: |
          xvfb-run -a timeout 180 godot --audio-driver Dummy --path . --script tests/render_fall_world.gd > test-results/linux/fall-world.log 2>&1
          grep -q FALL_WORLD_VISUAL_OK test-results/linux/fall-world.log
          if grep -E 'SCRIPT ERROR|ERROR:' test-results/linux/fall-world.log; then exit 1; fi
          cp -r test-results/fall-world test-results/linux/
      - name: Day and night graphical review
        if: matrix.suite == 'graphics'
        run: |
          xvfb-run -a timeout 180 godot --audio-driver Dummy --path . --script tests/test_day_night.gd > test-results/linux/day-night.log 2>&1
          grep -q DAY_NIGHT_OK test-results/linux/day-night.log
          if grep -E 'SCRIPT ERROR|ERROR:' test-results/linux/day-night.log; then exit 1; fi
          cp test-results/night-*.png test-results/linux/
      - name: Authored valley graphical review
        if: matrix.suite == 'graphics'
        run: |
          xvfb-run -a timeout 180 godot --audio-driver Dummy --path . --script tests/test_region.gd > test-results/linux/region.log 2>&1
          grep -q REGION_OK test-results/linux/region.log
          if grep -E 'SCRIPT ERROR|ERROR:' test-results/linux/region.log; then exit 1; fi
          cp test-results/region-*.png test-results/linux/
      - name: Map visual review
        if: matrix.suite == 'graphics'
        run: |
          xvfb-run -a timeout 180 godot --audio-driver Dummy --path . --script tests/test_map_places.gd > test-results/linux/map.log 2>&1
          grep -q MAP_PLACES_OK test-results/linux/map.log
          if grep -E 'SCRIPT ERROR|ERROR:' test-results/linux/map.log; then exit 1; fi
          cp test-results/map-places.png test-results/linux/
      - name: Fishing and mining graphical review
        if: matrix.suite == 'graphics'
        run: |
          xvfb-run -a timeout 180 godot --audio-driver Dummy --path . --script tests/test_resource_world.gd > test-results/linux/resources-world.log 2>&1
          grep -q RESOURCE_WORLD_OK test-results/linux/resources-world.log
          if grep -E 'SCRIPT ERROR|ERROR:' test-results/linux/resources-world.log; then exit 1; fi
          cp test-results/resource-*.png test-results/linux/
      - name: Mine galleries graphical review
        if: matrix.suite == 'graphics'
        run: |
          xvfb-run -a timeout 180 godot --audio-driver Dummy --path . --script tests/test_mine_exploration.gd > test-results/linux/mine-exploration.log 2>&1
          grep -q MINE_EXPLORATION_OK test-results/linux/mine-exploration.log
          if grep -E 'SCRIPT ERROR|ERROR:' test-results/linux/mine-exploration.log; then exit 1; fi
          cp test-results/mine-*.png test-results/linux/
      - name: Construction menu and mouse building in cooperative play
        if: matrix.suite == 'graphics'
        run: |
          xvfb-run -a timeout 180 godot --audio-driver Dummy --path . --script tests/test_build_menu.gd > test-results/linux/build-menu.log 2>&1
          grep -q BUILD_MENU_OK test-results/linux/build-menu.log
          if grep -E 'SCRIPT ERROR|ERROR:' test-results/linux/build-menu.log; then exit 1; fi
          cp test-results/build-menu-*.png test-results/linux/
          xvfb-run -a python3 tests/run_network.py --godot godot --gui --test test_coop_build_menu
      - name: Wayland graphical gameplay and fullscreen
        if: matrix.suite == 'graphics'
        shell: bash
        run: |
          set -euo pipefail
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/wayland-runtime"
          mkdir -p "$XDG_RUNTIME_DIR"; chmod 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless-backend.so --use-pixman --width=1920 --height=1080 --socket=wayland-qa --idle-time=0 >test-results/linux/weston.log 2>&1 &
          for i in $(seq 1 50); do [ -S "$XDG_RUNTIME_DIR/wayland-qa" ] && break; sleep .1; done
          export WAYLAND_DISPLAY=wayland-qa
          timeout 180 godot --display-driver wayland --audio-driver Dummy --path . --script tests/test_linux.gd >test-results/linux/wayland.log 2>&1
          cat test-results/linux/wayland.log
          grep -q LINUX_QA_OK test-results/linux/wayland.log
          ! grep -E 'SCRIPT ERROR|ERROR:' test-results/linux/wayland.log
      - name: Export and run the native release
        if: matrix.suite == 'graphics'
        shell: bash
        run: |
          set -euo pipefail
          timeout 300 godot --headless --path . --export-release 'Linux Desktop' exports/linux/DoMatoAoMilhao.x86_64 >test-results/linux/export.log 2>&1
          ! grep -E 'SCRIPT ERROR|ERROR:' test-results/linux/export.log
          chmod +x exports/linux/DoMatoAoMilhao.x86_64
          file exports/linux/DoMatoAoMilhao.x86_64 | tee test-results/linux/binary.txt
          ldd exports/linux/DoMatoAoMilhao.x86_64 | tee test-results/linux/libraries.txt
          ! grep -q 'not found' test-results/linux/libraries.txt
          xvfb-run -a -s '-screen 0 1920x1080x24' timeout 180 bash tools/linux/smoke_release.sh
          cat test-results/linux/export-smoke.log
          ! grep -E 'SCRIPT ERROR|ERROR:' test-results/linux/export-smoke.log
          git rev-parse HEAD > exports/linux/COMMIT.txt
          cp tools/linux/jogar.sh exports/linux/
          cp LINUX.md exports/linux/LEIA-ME.md
          cp GODOT_LICENSE.txt AUDIO.md AUDIO_CREDITS.md MULTIPLAYER.md QUEDA_RETORNO.md MIRA.md MAPA.md VALE_SERRA.md PESCA_MINERACAO.md exports/linux/
          chmod +x exports/linux/jogar.sh
          tar -czf exports/DoMatoAoMilhao-Linux-x86_64.tar.gz -C exports/linux .
          sha256sum exports/DoMatoAoMilhao-Linux-x86_64.tar.gz | tee exports/SHA256SUMS
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: linux-validation-${{ matrix.suite }}
          path: |
            test-results/linux/
            test-results/network-*/host.log
            test-results/network-*/client.log
      - uses: actions/upload-artifact@v5
        if: matrix.suite == 'graphics'
        with:
          name: DoMatoAoMilhao-Linux-x86_64
          path: |
            exports/DoMatoAoMilhao-Linux-x86_64.tar.gz
            exports/SHA256SUMS
  linux:
    if: always()
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - name: Require every Linux suite
        env:
          SUITE_RESULT: ${{ needs.validate.result }}
        run: test "$SUITE_RESULT" = success
